<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Inter","DejaVu Sans",system-ui,sans-serif;background:#fbf7f2;display:flex;overflow:hidden}
.left{width:640px;background:#c8102e;color:#fff;padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.left:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:60px;background:#fbf7f2;clip-path:polygon(100% 0,100% 100%,0 100%)}
.mark{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600;opacity:.95}
h1{font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-1.5px}
p{font-size:30px;line-height:1.3;opacity:.92;max-width:470px}
.right{flex:1;position:relative}
.pin{position:absolute;width:56px;height:56px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.pin span{transform:rotate(45deg);font-size:24px;font-weight:700;color:#fff}
.grid{position:absolute;inset:0;background-image:radial-gradient(#d9cfc3 1.6px,transparent 1.6px);background-size:28px 28px;opacity:.8}
.tags{position:absolute;left:40px;right:48px;bottom:64px;display:flex;flex-wrap:wrap;gap:12px}
.tag{background:#fff;border:2px solid #eadfd3;border-radius:999px;padding:10px 20px;font-size:22px;color:#3b2f2a;font-weight:600}
</style></head><body>
<div class="left">
 <div class="mark"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#fff"/><circle cx="19" cy="22" r="11" fill="#c8102e"/><circle cx="22" cy="22" r="8.8" fill="#fff"/><polygon fill="#c8102e" points="31,22 26.6,23.4 26.6,28 23.9,24.3 19.5,25.7 22.2,22 19.5,18.3 23.9,19.7 26.6,16 26.6,20.6"/></svg>Açık kaynak harita</div>
 <h1>Türk Ürünleri Haritası</h1>
 <p>Dünyanın neresinde olursan ol, Türk marketini, fırınını ve restoranını bul.</p>
</div>
<div class="right"><div class="grid"></div>
 <div class="pin" style="left:90px;top:90px;background:#c8102e"><span>M</span></div>
 <div class="pin" style="left:300px;top:60px;background:#e0731c"><span>R</span></div>
 <div class="pin" style="left:420px;top:170px;background:#2f7d5b"><span>F</span></div>
 <div class="pin" style="left:200px;top:220px;background:#7a4bb3"><span>K</span></div>
 <div class="pin" style="left:60px;top:300px;background:#e0731c"><span>R</span></div>
 <div class="pin" style="left:360px;top:320px;background:#c8102e"><span>M</span></div>
 <div class="tags"><span class="tag">Market</span><span class="tag">Restoran</span><span class="tag">Kafe</span><span class="tag">Fırın</span><span class="tag">Berber</span></div>
</div>
</body></html>
