name: Veri kontrolü

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "app.js"
      - "community/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "app.js"
      - "community/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/validate-markets.js
      - run: node --check app.js
      - run: node --test tests/*.test.mjs
